{% block content %}
{% autoescape off %}


<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;700&family=Oswald:wght@300;700&family=Roboto:wght@300;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./dist/css/acc_active_email.css">

    <style>
        *,
        :after,
        :before {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            font-size: 62.5%;
            scroll-behavior: smooth;
            overflow-x: hidden
        }

        a,
        html {
            color: #232323
        }

        a {
            text-decoration: none
        }

        a:focus {
            outline: dashed
        }

        li {
            list-style: none
        }

        body {
            font-family: Nunito, sans-serif;
            font-weight: 300
        }

        h1,
        h2 {
            font-family: Roboto, sans-serif;
            font-weight: 700
        }

        .wrapper {
            margin: 0 auto;
            width: 100%;
            max-width: 1200px
        }

        .section-heading {
            font-size: 3.1rem;
            text-transform: uppercase;
            letter-spacing: 2px
        }

        @media (min-width:700px) {
            .section-heading {
                font-size: 4.5rem
            }
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            top: 0;
            width: 100%;
            height: 7rem;
            background-color: #a0ace4
        }

        .logo a {
            width: 100%;
            font-weight: 700
        }

        .footer {
            margin: 1em 0;
            font-size: 1.5rem
        }

        .footer,
        .thanks {
            text-align: center
        }

        .thanks {
            margin-bottom: 1em
        }

        .thanks h1 {
            text-transform: none
        }

        .thanks-text {
            font-size: 1.5rem;
            padding: .8em;
            margin-top: -.5em;
            margin-bottom: .7em
        }

        .thanks-btn {
            padding: .4em 1em;
            font-size: 1.8rem;
            background: #e0e0ff;
            border-radius: 15px;
            color: #232323;
            font-weight: 700;
            position: relative;
            transition: background-color .3s;
            overflow: hidden;
            z-index: 1
        }

        .thanks-btn:hover {
            background-color: #24fcfc
        }
    </style>

</head>

<main>

    <div class="wrapper">

        <table>

            <tr>
                <div class="logo" target="_blank" rel="noopener">
                    <a href="https://www.nhardwork.com/" class="section-heading">
                        !hardWork
                    </a>
                </div>
            </tr>

            <tr>
                <div class="thanks">

                    <h1 class="section-heading">Witaj {{user.username}},
                    </h1>

                    <p class="thanks-text">Proszę kliknąć poniższy przycisk, aby skorzystać z naszych usług.</p>

                    <a href="http://{{domain}}{% url 'activate' uidb64=uid token=token %}" class="thanks-btn"
                        tabindex="0">
                        Potwierdź adres e-mail
                    </a>


                </div>
            </tr>

            <tr>
                <p class="footer">&copy; !hardWork 2024</p>
            </tr>
        </table>
    </div>

</main>

</html>

{% endautoescape %}
{% endblock content %}
